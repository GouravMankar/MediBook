spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: auth-service

  datasource:
    url: ${AUTH_DB_URL}
    username: ${AIVEN_DB_USERNAME}
    password: ${AIVEN_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  security:
    oauth2:
      client:
        registration:

          google:
            client-id: ${GOOGLE_CLIENT_ID:change-me-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:change-me-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "${OAUTH2_REDIRECT_BASE_URL:http://13.60.197.51:8080}/login/oauth2/code/google"

          github:
            client-id: ${GITHUB_CLIENT_ID:change-me-github-client-id}
            client-secret: ${GITHUB_CLIENT_SECRET:change-me-github-client-secret}
            scope:
              - read:user
              - user:email
            redirect-uri: "${OAUTH2_REDIRECT_BASE_URL:http://13.60.197.51:8080}/login/oauth2/code/github"

server:
  port: 8081
  forward-headers-strategy: framework

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://medibook-book-appointments.s3-website.eu-north-1.amazonaws.com}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

  instance:
    prefer-ip-address: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: '*'

  endpoint:
    health:
      show-details: always

security:
  jwt:
    secret: ${JWT_SECRET:medibook-jwt-secret-key-2026-minimum-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
