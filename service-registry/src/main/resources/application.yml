spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: service-registry
server:
  port: 8761
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always
